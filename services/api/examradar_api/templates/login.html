{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block body %}
<div class="card" style="max-width:380px;margin:60px auto">
  <h2 style="margin-top:0">Admin login</h2>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <label>Email</label><input name="email" type="email" required autocomplete="username">
    <label>Password</label><input name="password" type="password" required autocomplete="current-password">
    <label>Authenticator code</label><input name="code" inputmode="numeric" pattern="[0-9]{6}" required autocomplete="one-time-code">
    <p><button class="primary" style="width:100%">Log in</button></p>
  </form>
  <p class="muted">Five failed attempts lock the account for 15 minutes.</p>
</div>
{% endblock %}
