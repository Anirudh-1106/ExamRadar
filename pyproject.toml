[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "examradar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pymupdf>=1.24",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "pyotp>=2.9",
  "celery>=5.4",
  "redis>=5.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.34"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.3"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8.2", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
examradar = "examradar_worker.cli:main"

[tool.setuptools.packages.find]
where = [
  "packages/core",
  "packages/source_adapters",
  "packages/extraction",
  "packages/eligibility",
  "services/api",
  "services/worker",
]

[tool.setuptools.package-data]
examradar_api = ["templates/*.html", "templates/**/*.html", "static/*"]
examradar_eligibility = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP046"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
mypy_path = "packages/core,packages/source_adapters,packages/extraction,packages/eligibility"
packages = ["examradar_eligibility", "examradar_extraction"]
explicit_package_bases = true
