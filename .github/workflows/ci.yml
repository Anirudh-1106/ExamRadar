name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: examradar, POSTGRES_USER: examradar, POSTGRES_PASSWORD: examradar }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U examradar" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,postgres]"
      - name: Format and lint
        run: ruff check packages services tests
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest
      - name: Migrations apply on PostgreSQL and match the models
        env: { DATABASE_URL: "postgresql+psycopg://examradar:examradar@localhost:5432/examradar" }
        run: cd services/api && alembic upgrade head && alembic check

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.29.2", channel: stable }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
