services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: examradar
      POSTGRES_USER: examradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examradar}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U examradar"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-examradar}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-examradar-secret}
    volumes: [minio:/data]
    ports: ["9001:9001"]

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    env_file: .env
    environment: &common
      DATABASE_URL: postgresql+psycopg://examradar:${POSTGRES_PASSWORD:-examradar}@postgres:5432/examradar
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["8000:8000"]

  worker:
    build: { context: ., dockerfile: services/worker/Dockerfile }
    env_file: .env
    environment: *common
    command: celery -A examradar_worker.celery_app worker --loglevel=INFO --concurrency=2
    depends_on: [api]

  beat:
    build: { context: ., dockerfile: services/worker/Dockerfile }
    env_file: .env
    environment: *common
    command: celery -A examradar_worker.celery_app beat --loglevel=INFO
    depends_on: [worker]

volumes:
  pgdata:
  minio:
