# Source registry. Hostnames were verified by direct fetch on the date shown (see docs/source-report.md).
# purpose: content = pages we collect, apply = valid apply link target, portal = login portal (link only)
# Apply links are valid only for the organisation they are listed under (docs/decisions.md D2).

organisations:
  - key: upsc
    name: Union Public Service Commission
    group: central
    collection: auto
    domains:
      - { host: www.upsc.gov.in, purpose: content, verified: 2026-11-08 }
      - { host: upsconline.gov.in, purpose: apply, verified: 2026-11-08 }
      - { host: upsconline.nic.in, purpose: apply, verified: 2026-11-08 }
    listings:
      - https://www.upsc.gov.in/whats-new
      - https://www.upsc.gov.in/examinations/active-exams
      - https://www.upsc.gov.in/examinations/forthcoming-exams
      - https://www.upsc.gov.in/examinations/exam-calendar
    apply_entry: https://upsconline.gov.in/
    schedule: { every_minutes: 120, active_deadline_minutes: 30 }

  - key: kerala_psc
    name: Kerala Public Service Commission
    group: kerala
    collection: auto
    domains:
      - { host: keralapsc.gov.in, purpose: content, verified: 2026-11-08 }
      - { host: www.keralapsc.gov.in, purpose: content, verified: 2026-11-08 }
      - { host: thulasi.psc.kerala.gov.in, purpose: apply, verified: 2026-11-08, note: "login portal, no deep links" }
      - { host: psc.kerala.gov.in, purpose: portal, verified: 2026-11-08 }
    listings:
      - https://keralapsc.gov.in/notifications
      - https://keralapsc.gov.in/examinations
      - https://keralapsc.gov.in/latest
      - https://keralapsc.gov.in/general-conditions
    apply_entry: https://thulasi.psc.kerala.gov.in/thulasi/
    schedule: { every_minutes: 120, active_deadline_minutes: 30 }

  - key: kdrb
    name: Kerala Devaswom Recruitment Board
    group: kerala
    collection: auto
    domains:
      - { host: kdrb.kerala.gov.in, purpose: content, verified: 2026-11-08 }
      - { host: recruitment.kdrb.kerala.gov.in, purpose: apply, verified: 2026-11-08 }
    listings:
      - https://kdrb.kerala.gov.in/category/examination/notifications/
      - https://kdrb.kerala.gov.in/category/examination/announcements/
    apply_entry: https://recruitment.kdrb.kerala.gov.in/
    schedule: { every_minutes: 180 }

  - key: sbi
    name: State Bank of India
    group: central
    collection: auto
    domains:
      - { host: sbi.bank.in, purpose: content, verified: 2026-11-08 }
      - { host: recruitment.sbi.bank.in, purpose: apply, verified: 2026-11-08 }
      - { host: ibpsreg.ibps.in, purpose: apply, verified: 2026-11-08, note: "used by some SBI recruitments" }
    listings:
      - https://sbi.bank.in/web/careers/current-openings
    schedule: { every_minutes: 120 }

  - key: ibps
    name: Institute of Banking Personnel Selection
    group: central
    collection: auto
    skip_title_prefixes: ["SBI "]
    domains:
      - { host: www.ibps.in, purpose: content, verified: 2026-11-08 }
      - { host: ibpsreg.ibps.in, purpose: apply, verified: 2026-11-08 }
    listings:
      - https://www.ibps.in/
    schedule: { every_minutes: 120 }

  - key: nta
    name: National Testing Agency
    group: central
    collection: auto
    include_keywords: ["UGC", "CSIR", "NET", "recruitment", "teacher"]
    domains:
      - { host: nta.ac.in, purpose: content, verified: 2026-11-08 }
      - { host: www.nta.ac.in, purpose: content, verified: 2026-11-08 }
      - { host: ugcnet.nta.nic.in, purpose: content, verified: 2026-11-08 }
      - { host: csirnet.nta.nic.in, purpose: content, verified: 2026-11-08 }
      - { host: exams.nta.nic.in, purpose: content, verified: 2026-11-08 }
      - { host: exams.nta.ac.in, purpose: content, verified: 2026-11-08 }
      - { host: examinationservices.nic.in, purpose: apply, verified: 2026-11-08 }
    listings:
      - https://nta.ac.in/
    schedule: { every_minutes: 120 }

  - key: rrb
    name: Railway Recruitment Boards
    group: central
    collection: auto
    crawl_delay_seconds: 12
    domains:
      - { host: rrb.indianrailways.gov.in, purpose: content, verified: 2026-11-08 }
    listings:
      - https://rrb.indianrailways.gov.in/thiruvananthapuram
    schedule: { every_minutes: 180 }

  - key: ssc
    name: Staff Selection Commission
    group: central
    collection: auto            # rendered in a headless browser; owner approved collecting from the site
    domains:
      - { host: ssc.gov.in, purpose: content, verified: 2026-11-08 }
    listings:
      - https://ssc.gov.in/
    schedule: { every_minutes: 180 }

  - key: rbi
    name: Reserve Bank of India
    group: central
    collection: rss_and_manual  # recruitment site has an image CAPTCHA, never fetched (decisions D5)
    domains:
      - { host: opportunities.rbi.org.in, purpose: content, verified: 2026-11-08, note: "CAPTCHA; link only" }
      - { host: www.rbi.org.in, purpose: content, verified: 2026-11-08 }
      - { host: rbi.org.in, purpose: content, verified: 2026-11-08 }
    listings:
      - { url: "https://www.rbi.org.in/pressreleases_rss.xml", kind: rss }
    apply_entry: https://opportunities.rbi.org.in/Scripts/Vacancies.aspx
    schedule: { every_minutes: 120 }

  # ---- Later sources (checked 2026-11-08). All use the configurable adapter; see adapters/generic.py for options.
  - key: cmd_kerala
    adapter: generic
    name: Centre for Management Development, Kerala
    group: kerala
    sector: other
    collection: auto
    follow: true
    domains:
      - { host: cmd.kerala.gov.in, purpose: content, verified: 2026-11-08 }
    listings:
      - https://cmd.kerala.gov.in/recruitment/
    schedule: { every_minutes: 240 }

  - key: ktet
    adapter: generic
    name: Kerala Teacher Eligibility Test (Pareeksha Bhavan)
    group: kerala
    sector: teaching
    collection: auto
    include: "notification|prospectus|result|hall ?ticket|admit|answer ?key|time ?table|exam date|k-?tet"
    exclude: "model question|question paper|g\\.?o\\.?\\s*\\(|forgot"
    docs_only: true
    cycle: { mode: family, family: K-TET }
    domains:
      - { host: ktet.kerala.gov.in, purpose: content, verified: 2026-11-08 }
    listings:
      - https://ktet.kerala.gov.in/
      - https://ktet.kerala.gov.in/notification.php
    schedule: { every_minutes: 360 }

  - key: kerala_set
    adapter: generic
    name: Kerala State Eligibility Test (LBS Centre)
    group: kerala
    sector: teaching
    collection: auto
    # SET notices appear in the LBS Centre homepage news when a session opens.
    include: '\bSET\b|state eligibility'
    docs_only: true
    cycle: { mode: family, family: Kerala SET }
    domains:
      - { host: lbscentre.kerala.gov.in, purpose: content, verified: 2026-11-08 }
    listings:
      - https://lbscentre.kerala.gov.in/
    schedule: { every_minutes: 360 }

  - key: kerala_hc
    adapter: generic
    name: High Court of Kerala (Recruitment)
    group: kerala
    sector: other
    collection: auto
    render: [https://hckrecruitment.keralacourts.in/hckrecruitment/Recruitment/notifications]
    recent_years: 1
    table: { number: 0, title: 2, start: 3, end: 4 }
    max_age_days: 400
    domains:
      - { host: hckrecruitment.keralacourts.in, purpose: content, verified: 2026-11-08 }
      - { host: highcourt.kerala.gov.in, purpose: content, verified: 2026-11-08 }
    listings:
      - https://hckrecruitment.keralacourts.in/hckrecruitment/Recruitment/notifications
    schedule: { every_minutes: 360 }

  - key: kvs
    adapter: generic
    name: Kendriya Vidyalaya Sangathan
    group: central
    sector: teaching
    collection: auto
    include: "recruit|advertis|vacanc|exam|result|admit|answer ?key|interview|selection"
    render: [https://kvs.gov.in/en/recruitment/]
    domains:
      - { host: kvs.gov.in, purpose: content, verified: 2026-11-08 }
      - { host: cdnbbsr.s3waas.gov.in, path_prefix: /s32d2ca7eedf739ef4c3800713ec482e1a/, purpose: content, verified: 2026-11-08, note: "KVS folder on the government S3WaaS host" }
    listings:
      - https://kvs.gov.in/en/recruitment/
    schedule: { every_minutes: 360 }

  - key: nvs
    adapter: generic
    name: Navodaya Vidyalaya Samiti
    group: central
    sector: teaching
    collection: auto
    render: [https://navodaya.gov.in/nvs/en/Home1]
    # The recruitment box lists notices in Hindi as rows with script links and a publication date.
    rows: "#recruitment .nvs3-job-row"
    no_links: true
    published: 'प्रकाशित तिथि:\s*(\d{4}-\d{2}-\d{2})'
    include: "भर्ती|अधिसूचना|परीक्षा|प्रवेश पत्र|विज्ञापन|परिणाम|recruit|notification|exam|admit|result"
    domains:
      - { host: navodaya.gov.in, purpose: content, verified: 2026-11-08 }
    listings:
      - https://navodaya.gov.in/nvs/en/Home1
    schedule: { every_minutes: 360 }

  - key: ctet
    adapter: generic
    name: Central Teacher Eligibility Test (CBSE)
    group: central
    sector: teaching
    collection: auto
    cycle: { mode: family, family: CTET }
    recent_years: 1
    domains:
      - { host: ctet.nic.in, purpose: content, verified: 2026-11-08 }
      - { host: cdnbbsr.s3waas.gov.in, path_prefix: /s3443dec3062d0286986e21dc0631734c9/, purpose: content, verified: 2026-11-08, note: "CTET folder on the government S3WaaS host" }
    listings:
      - https://ctet.nic.in/
    schedule: { every_minutes: 240 }

  - key: isro
    adapter: generic
    name: Indian Space Research Organisation
    group: central
    sector: engineering
    collection: auto
    follow: true
    grid: { title: post, number: advtNum, start: opendate, end: closedate }
    max_age_days: 400
    recent_years: 1
    domains:
      - { host: www.isro.gov.in, purpose: content, verified: 2026-11-08 }
    listings:
      - https://www.isro.gov.in/CurrentOpportunities.html
    schedule: { every_minutes: 360 }

  - key: drdo
    adapter: generic
    name: Defence Research and Development Organisation
    group: central
    sector: engineering
    collection: auto
    follow: true
    domains:
      - { host: xn--m1b0a2bb8esed.xn--11b7cb3a6a.xn--h2brj9c, purpose: content, verified: 2026-11-08, note: "DRDO's official Hindi-script domain; drdo.gov.in redirects here" }
      - { host: www.drdo.gov.in, purpose: content, verified: 2026-11-08 }
    listings:
      - https://xn--m1b0a2bb8esed.xn--11b7cb3a6a.xn--h2brj9c/drdo/en/offerings/vacancies
    schedule: { every_minutes: 360 }

  - key: lic
    adapter: generic
    name: Life Insurance Corporation of India
    group: central
    sector: banking
    collection: auto
    render: [https://licindia.in/careers]
    include: "recruit|advertis|vacanc|exam|result|admit|call letter|apprentice|assistant|officer|aao|ado"
    domains:
      - { host: licindia.in, purpose: content, verified: 2026-11-08 }
    listings:
      - https://licindia.in/careers
    schedule: { every_minutes: 360 }

  - key: epfo
    adapter: generic
    name: Employees' Provident Fund Organisation
    group: central
    sector: other
    collection: auto
    render: [https://www.epfo.gov.in/recruitments/]
    domains:
      - { host: www.epfo.gov.in, purpose: content, verified: 2026-11-08 }
      - { host: www.epfindia.gov.in, purpose: content, verified: 2026-11-08 }
    listings:
      - https://www.epfo.gov.in/recruitments/
    schedule: { every_minutes: 360 }

# Publisher RSS feeds used as signals only. Robots rules checked 2026-11-08.
news_feeds:
  - { key: news_indianexpress_jobs, publisher: The Indian Express, url: "https://indianexpress.com/section/jobs/feed/", enabled: true }
  - { key: news_thehindu_education, publisher: The Hindu, url: "https://www.thehindu.com/education/feeder/default.rss", enabled: true }
  - { key: news_mathrubhumi, publisher: Mathrubhumi, url: "https://www.mathrubhumi.com/rss", enabled: true }
  # Added 2026-11-08 for UPSC coverage while upsc.gov.in refuses the crawler (decisions D13). robots.txt allows both.
  - { key: news_indianexpress_education, publisher: The Indian Express, url: "https://indianexpress.com/section/education/feed/", enabled: true }
  - { key: news_livemint_education, publisher: Mint, url: "https://www.livemint.com/rss/education", enabled: true }
  # Google News search feeds: disabled by default pending legal review (docs/legal-review.md L11).
  - { key: news_google_rbi, publisher: Google News, url: "https://news.google.com/rss/search?q=RBI+recruitment&hl=en-IN&gl=IN&ceid=IN:en", enabled: false, google: true }
  - { key: news_google_kpsc, publisher: Google News, url: "https://news.google.com/rss/search?q=Kerala+PSC&hl=en-IN&gl=IN&ceid=IN:en", enabled: false, google: true }
  - { key: news_google_ssc, publisher: Google News, url: "https://news.google.com/rss/search?q=SSC+exam+notification&hl=en-IN&gl=IN&ceid=IN:en", enabled: false, google: true }
